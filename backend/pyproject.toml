[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    
    # Zep Cloud
    "zep-cloud==3.25.0",
    "httpx>=0.27.0",
    
    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# 安全下限：已知漏洞的最低修复版本（pip-audit, 2026-10）
# camel-oasis 精确锁定 pillow==10.3.0 / unstructured==0.13.7 / sentence-transformers==3.0.0 / pytest==8.2.0，
# sentence-transformers 要求 transformers<5，因此这些包无法在此升级
constraint-dependencies = [
    "anyio>=4.14.2",
    "cryptography>=50.0.0",
    "filelock>=3.20.3,<4",
    "flask>=3.1.3",
    "fsspec>=2026.6.0",
    "idna>=3.15",
    "lxml>=6.1.0",
    "marshmallow>=3.26.2,<4",
    "mcp>=1.28.1,<2",
    "nltk>=3.10.3",
    "oauthlib>=4.0.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.15.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "setuptools>=83.0.0",
    "soupsieve>=2.9.0,<3",
    "starlette>=1.3.1",
    "torch>=2.13.0",
    "transformers>=4.57.6,<5",
    "urllib3>=2.8.0",
    "virtualenv>=21.7.13",
    "werkzeug>=3.1.9",
]
